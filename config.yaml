# 每次运行随机取一个关键词搜索 Pexels（偏向航拍/延时等带运镜的素材）
keywords:
  # 海
  - "flying over ocean waves"
  - "drone sunset beach"
  - "lighthouse aerial view"
  - "drone tropical island"
  # 山与地貌
  - "aerial mountain sunrise"
  - "drone snow mountain"
  - "canyon drone flight"
  - "desert dunes aerial"
  - "glacier aerial timelapse"
  - "rice terraces aerial"
  # 森林与植物
  - "waterfall aerial shot"
  - "autumn forest drone flight"
  - "cherry blossom spring wind"
  - "lavender field drone"
  - "rainforest aerial mist"
  - "flying over green meadow"
  # 水与天空
  - "drone calm lake"
  - "mountain river aerial"
  - "starry sky timelapse"
  - "aurora timelapse"
  - "clouds timelapse sky"

video_filter:
  orientation: landscape   # 仅横屏
  min_duration: 20         # 秒（只截片段，≥每段长度即可）
  max_duration: 300        # 控制下载文件大小
  min_motion: 0.8          # 机位运动分阈值（像素/帧），低于则判静态镜头淘汰

clip:
  per_segment: 15          # 每个画面截取秒数（成片 = 2 × per_segment）
  bgm_volume: 1.4          # BGM 音量倍率（宿命感拉满但不爆音）
  contrast: 1.10           # 对比度（1.0=原图）
  brightness: 0.04         # 亮度（0=原图，0.04 适度提亮）
  saturation: 1.12         # 饱和度（1.0=原图）

download:
  max_height: 1080         # 取 ≤1080p 的最大画质即可

bilibili:
  tid: 160                 # 分区：生活-日常（可改）
  tags_extra: ["风景", "治愈", "自然"]

copywriter:
  model: "glm-4-flash"     # 免费；可改 glm-4.6
  temperature: 0.8

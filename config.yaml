# 每次运行随机取一个关键词搜索 Pexels（每天自然轮换，题材均衡）
keywords:
  # 海
  - "ocean waves"
  - "sunset beach"
  - "lighthouse coast"
  - "tropical island"
  # 山与地貌
  - "mountain sunrise"
  - "snow mountain"
  - "canyon cliffs"
  - "desert dunes"
  - "glacier ice"
  - "rice terraces"
  # 森林与植物
  - "forest waterfall"
  - "autumn forest leaves"
  - "cherry blossom spring"
  - "lavender field"
  - "rainforest mist"
  - "green field meadow"
  # 水与天空
  - "calm lake reflection"
  - "mountain river stream"
  - "starry sky timelapse"
  - "aurora"
  - "clouds timelapse"

video_filter:
  orientation: landscape   # 仅横屏
  min_duration: 20         # 秒（只截片段，≥每段长度即可）
  max_duration: 300        # 控制下载文件大小

clip:
  per_segment: 15          # 每个画面截取秒数（成片 = 2 × per_segment）
  bgm_volume: 1.4          # BGM 音量倍率（宿命感拉满但不爆音）
  contrast: 1.10           # 对比度（1.0=原图）
  brightness: 0.04         # 亮度（0=原图，0.04 适度提亮）
  saturation: 1.12         # 饱和度（1.0=原图）

download:
  max_height: 1080         # 取 ≤1080p 的最大画质即可

bilibili:
  tid: 160                 # 分区：生活-日常（可改）
  tags_extra: ["风景", "治愈", "自然"]

copywriter:
  model: "glm-4-flash"     # 免费；可改 glm-4.6
  temperature: 0.8
